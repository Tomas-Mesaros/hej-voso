<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="galleryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c91919;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#galleryBg)" rx="8"/>
  
  <!-- Photo frames -->
  <g>
    <!-- Frame 1 -->
    <g transform="translate(40, 40)">
      <rect x="0" y="0" width="60" height="45" fill="url(#frameGradient)" rx="3"/>
      <rect x="3" y="3" width="54" height="39" fill="#1a1a1a" rx="2"/>
      <rect x="6" y="6" width="48" height="33" fill="#333" rx="1"/>
      <!-- Image icon -->
      <circle cx="30" cy="18" r="6" fill="#ff8c00" opacity="0.6"/>
      <polygon points="20,28 25,23 30,28 35,23 40,28 40,33 20,33" fill="#ff8c00" opacity="0.6"/>
    </g>
    
    <!-- Frame 2 -->
    <g transform="translate(120, 30)">
      <rect x="0" y="0" width="70" height="50" fill="url(#frameGradient)" rx="3"/>
      <rect x="3" y="3" width="64" height="44" fill="#1a1a1a" rx="2"/>
      <rect x="6" y="6" width="58" height="38" fill="#333" rx="1"/>
      <!-- Image icon -->
      <circle cx="35" cy="20" r="7" fill="#c91919" opacity="0.6"/>
      <polygon points="22,32 28,26 35,32 42,26 48,32 48,38 22,38" fill="#c91919" opacity="0.6"/>
    </g>
    
    <!-- Frame 3 -->
    <g transform="translate(210, 45)">
      <rect x="0" y="0" width="55" height="40" fill="url(#frameGradient)" rx="3"/>
      <rect x="3" y="3" width="49" height="34" fill="#1a1a1a" rx="2"/>
      <rect x="6" y="6" width="43" height="28" fill="#333" rx="1"/>
      <!-- Image icon -->
      <circle cx="27.5" cy="16" r="5" fill="#ff8c00" opacity="0.6"/>
      <polygon points="18,25 22,21 27.5,25 33,21 37,25 37,28 18,28" fill="#ff8c00" opacity="0.6"/>
    </g>
    
    <!-- Frame 4 -->
    <g transform="translate(60, 110)">
      <rect x="0" y="0" width="65" height="48" fill="url(#frameGradient)" rx="3"/>
      <rect x="3" y="3" width="59" height="42" fill="#1a1a1a" rx="2"/>
      <rect x="6" y="6" width="53" height="36" fill="#333" rx="1"/>
      <!-- Image icon -->
      <circle cx="32.5" cy="19" r="6" fill="#c91919" opacity="0.6"/>
      <polygon points="21,30 26,25 32.5,30 39,25 44,30 44,36 21,36" fill="#c91919" opacity="0.6"/>
    </g>
    
    <!-- Frame 5 -->
    <g transform="translate(150, 120)">
      <rect x="0" y="0" width="58" height="42" fill="url(#frameGradient)" rx="3"/>
      <rect x="3" y="3" width="52" height="36" fill="#1a1a1a" rx="2"/>
      <rect x="6" y="6" width="46" height="30" fill="#333" rx="1"/>
      <!-- Image icon -->
      <circle cx="29" cy="17" r="5" fill="#ff8c00" opacity="0.6"/>
      <polygon points="20,26 24,22 29,26 34,22 38,26 38,30 20,30" fill="#ff8c00" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Camera icon -->
  <g transform="translate(20, 20)" opacity="0.4">
    <rect x="0" y="5" width="20" height="12" fill="#ff8c00" rx="2"/>
    <rect x="2" y="7" width="16" height="8" fill="#1a1a1a" rx="1"/>
    <circle cx="10" cy="11" r="3" fill="#ff8c00"/>
    <circle cx="10" cy="11" r="2" fill="#1a1a1a"/>
    <rect x="6" y="2" width="8" height="3" fill="#ff8c00" rx="1"/>
  </g>
  
  <!-- Gallery text -->
  <g transform="translate(150, 180)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="14" fill="#ff8c00" font-weight="bold">GALÉRIA</text>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.3">
    <circle cx="250" cy="30" r="2" fill="#ff8c00"/>
    <circle cx="260" cy="25" r="1.5" fill="#c91919"/>
    <circle cx="270" cy="35" r="2.5" fill="#ff8c00"/>
    
    <circle cx="30" cy="170" r="2" fill="#c91919"/>
    <circle cx="20" cy="175" r="1.5" fill="#ff8c00"/>
    <circle cx="40" cy="165" r="2.5" fill="#c91919"/>
  </g>
  
  <!-- Border -->
  <rect width="300" height="200" fill="none" stroke="#ff8c00" stroke-width="2" rx="8"/>
</svg>
