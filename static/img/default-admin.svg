<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="adminAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c91919;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="url(#adminBg)" rx="10"/>
  
  <!-- Gear/Settings icon -->
  <g transform="translate(50, 50)">
    <!-- Main gear -->
    <path d="M-20,-5 L-15,-15 L-5,-15 L0,-20 L5,-15 L15,-15 L20,-5 L15,5 L20,15 L10,20 L0,15 L-10,20 L-20,15 L-15,5 Z" 
          fill="url(#adminAccent)" opacity="0.8"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="8" fill="#1a1a1a"/>
    <circle cx="0" cy="0" r="6" fill="url(#adminAccent)"/>
    
    <!-- Center hole -->
    <circle cx="0" cy="0" r="3" fill="#1a1a1a"/>
    
    <!-- Small gears -->
    <g transform="translate(25, -25) scale(0.4)">
      <path d="M-10,-3 L-8,-8 L-3,-8 L0,-10 L3,-8 L8,-8 L10,-3 L8,3 L10,8 L5,10 L0,8 L-5,10 L-10,8 L-8,3 Z" 
            fill="url(#adminAccent)" opacity="0.6"/>
      <circle cx="0" cy="0" r="4" fill="#1a1a1a"/>
    </g>
    
    <g transform="translate(-25, 25) scale(0.3)">
      <path d="M-8,-2 L-6,-6 L-2,-6 L0,-8 L2,-6 L6,-6 L8,-2 L6,2 L8,6 L4,8 L0,6 L-4,8 L-8,6 L-6,2 Z" 
            fill="url(#adminAccent)" opacity="0.6"/>
      <circle cx="0" cy="0" r="3" fill="#1a1a1a"/>
    </g>
  </g>
  
  <!-- Admin text -->
  <text x="50" y="85" text-anchor="middle" font-family="Arial" font-size="10" fill="#ff8c00" font-weight="bold">ADMIN</text>
  
  <!-- Border -->
  <rect width="100" height="100" fill="none" stroke="#ff8c00" stroke-width="2" rx="10"/>
</svg>
