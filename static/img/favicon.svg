<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c91919;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" fill="#1a1a1a" rx="6"/>
  
  <!-- Music note -->
  <g transform="translate(16, 16)">
    <!-- Note stem -->
    <rect x="4" y="-8" width="2" height="12" fill="url(#faviconGradient)"/>
    
    <!-- Note head -->
    <ellipse cx="2" cy="5" rx="3" ry="2" fill="url(#faviconGradient)" transform="rotate(-20)"/>
    
    <!-- Musical staff lines -->
    <line x1="-8" y1="-3" x2="8" y2="-3" stroke="url(#faviconGradient)" stroke-width="0.5" opacity="0.6"/>
    <line x1="-8" y1="-1" x2="8" y2="-1" stroke="url(#faviconGradient)" stroke-width="0.5" opacity="0.6"/>
    <line x1="-8" y1="1" x2="8" y2="1" stroke="url(#faviconGradient)" stroke-width="0.5" opacity="0.6"/>
    <line x1="-8" y1="3" x2="8" y2="3" stroke="url(#faviconGradient)" stroke-width="0.5" opacity="0.6"/>
  </g>
</svg>
