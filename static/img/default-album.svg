<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="albumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8c00;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#333;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="discGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c91919;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#albumBg)" rx="8"/>
  
  <!-- Vinyl record -->
  <g transform="translate(100, 100)">
    <!-- Main disc -->
    <circle cx="0" cy="0" r="80" fill="url(#discGradient)" stroke="#ff8c00" stroke-width="1"/>
    
    <!-- Grooves -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Center label -->
    <circle cx="0" cy="0" r="25" fill="url(#centerGradient)"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    
    <!-- Center hole -->
    <circle cx="0" cy="0" r="4" fill="#1a1a1a"/>
    
    <!-- Label text -->
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="8" fill="#1a1a1a" font-weight="bold">HEJ-VOSO</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="6" fill="#1a1a1a">ALBUM</text>
  </g>
  
  <!-- Musical notes decoration -->
  <g opacity="0.4">
    <text x="20" y="30" font-family="Arial" font-size="16" fill="#ff8c00">♪</text>
    <text x="170" y="40" font-family="Arial" font-size="14" fill="#ff8c00">♫</text>
    <text x="30" y="180" font-family="Arial" font-size="12" fill="#ff8c00">♬</text>
    <text x="160" y="170" font-family="Arial" font-size="18" fill="#ff8c00">♪</text>
  </g>
  
  <!-- Shine effect -->
  <path d="M50,50 Q100,30 150,50 Q120,80 100,100 Q80,80 50,50" 
        fill="url(#centerGradient)" opacity="0.1"/>
  
  <!-- Border -->
  <rect width="200" height="200" fill="none" stroke="#ff8c00" stroke-width="2" rx="8"/>
</svg>
