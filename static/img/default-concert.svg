<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stageFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#555;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="lightBeam" cx="50%" cy="0%" r="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#stageBg)"/>
  
  <!-- Stage floor -->
  <rect x="0" y="180" width="400" height="70" fill="url(#stageFloor)"/>
  
  <!-- Stage lights -->
  <g>
    <!-- Light fixtures -->
    <rect x="80" y="20" width="8" height="15" fill="#333" rx="2"/>
    <rect x="200" y="20" width="8" height="15" fill="#333" rx="2"/>
    <rect x="320" y="20" width="8" height="15" fill="#333" rx="2"/>
    
    <!-- Light beams -->
    <ellipse cx="84" cy="35" rx="40" ry="80" fill="url(#lightBeam)" opacity="0.3"/>
    <ellipse cx="204" cy="35" rx="40" ry="80" fill="url(#lightBeam)" opacity="0.3"/>
    <ellipse cx="324" cy="35" rx="40" ry="80" fill="url(#lightBeam)" opacity="0.3"/>
    
    <!-- Colored spotlights -->
    <ellipse cx="84" cy="35" rx="30" ry="60" fill="#ff8c00" opacity="0.2"/>
    <ellipse cx="204" cy="35" rx="30" ry="60" fill="#c91919" opacity="0.2"/>
    <ellipse cx="324" cy="35" rx="30" ry="60" fill="#ff8c00" opacity="0.2"/>
  </g>
  
  <!-- Musical instruments on stage -->
  <g>
    <!-- Drum kit -->
    <g transform="translate(200, 160)">
      <!-- Bass drum -->
      <ellipse cx="0" cy="0" rx="25" ry="15" fill="#2d2d2d" stroke="#ff8c00" stroke-width="2"/>
      <!-- Snare -->
      <ellipse cx="-15" cy="-10" rx="8" ry="5" fill="#333" stroke="#ff8c00" stroke-width="1"/>
      <!-- Hi-hat -->
      <ellipse cx="15" cy="-10" rx="6" ry="3" fill="#333" stroke="#ff8c00" stroke-width="1"/>
      <!-- Cymbals -->
      <ellipse cx="-25" cy="-15" rx="10" ry="2" fill="#c91919" opacity="0.8"/>
      <ellipse cx="25" cy="-15" rx="10" ry="2" fill="#c91919" opacity="0.8"/>
    </g>
    
    <!-- Guitar amplifier -->
    <g transform="translate(120, 170)">
      <rect x="0" y="0" width="30" height="20" fill="#1a1a1a" stroke="#ff8c00" stroke-width="1" rx="2"/>
      <circle cx="8" cy="8" r="3" fill="#333"/>
      <circle cx="22" cy="8" r="3" fill="#333"/>
      <rect x="5" y="14" width="20" height="2" fill="#ff8c00"/>
    </g>
    
    <!-- Microphone stand -->
    <g transform="translate(160, 140)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#333" stroke-width="3"/>
      <circle cx="0" cy="0" r="4" fill="#ff8c00"/>
      <line x1="-8" y1="35" x2="8" y2="35" stroke="#333" stroke-width="2"/>
    </g>
    
    <!-- Keyboard -->
    <g transform="translate(280, 165)">
      <rect x="0" y="0" width="40" height="8" fill="#1a1a1a" stroke="#ff8c00" stroke-width="1" rx="1"/>
      <!-- Keys -->
      <rect x="2" y="2" width="2" height="4" fill="#f1f1f1"/>
      <rect x="5" y="2" width="2" height="4" fill="#f1f1f1"/>
      <rect x="8" y="2" width="2" height="4" fill="#f1f1f1"/>
      <rect x="11" y="2" width="2" height="4" fill="#f1f1f1"/>
      <rect x="14" y="2" width="2" height="4" fill="#f1f1f1"/>
      <rect x="17" y="2" width="2" height="4" fill="#f1f1f1"/>
      <rect x="20" y="2" width="2" height="4" fill="#f1f1f1"/>
    </g>
    
    <!-- Guitar -->
    <g transform="translate(80, 150) rotate(-15)">
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="12" ry="20" fill="#8B4513" stroke="#ff8c00" stroke-width="1"/>
      <!-- Neck -->
      <rect x="-2" y="-25" width="4" height="15" fill="#8B4513"/>
      <!-- Head -->
      <rect x="-3" y="-30" width="6" height="8" fill="#8B4513" rx="1"/>
      <!-- Strings -->
      <line x1="0" y1="-25" x2="0" y2="15" stroke="#C0C0C0" stroke-width="0.5"/>
      <line x1="-1" y1="-25" x2="-1" y2="15" stroke="#C0C0C0" stroke-width="0.5"/>
      <line x1="1" y1="-25" x2="1" y2="15" stroke="#C0C0C0" stroke-width="0.5"/>
    </g>
  </g>
  
  <!-- Musical notes floating -->
  <g opacity="0.4">
    <text x="50" y="60" font-family="Arial" font-size="20" fill="#ff8c00">♪</text>
    <text x="350" y="80" font-family="Arial" font-size="16" fill="#c91919">♫</text>
    <text x="100" y="100" font-family="Arial" font-size="18" fill="#ff8c00">♬</text>
    <text x="300" y="120" font-family="Arial" font-size="14" fill="#c91919">♪</text>
    <text x="150" y="70" font-family="Arial" font-size="22" fill="#ff8c00">♫</text>
  </g>
  
  <!-- Stage edge -->
  <rect x="0" y="175" width="400" height="5" fill="#ff8c00" opacity="0.6"/>
  
  <!-- Concert text -->
  <g transform="translate(200, 220)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="16" fill="#ff8c00" font-weight="bold">KONCERT</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial" font-size="10" fill="#f1f1f1" opacity="0.7">HEJ-VOSO</text>
  </g>
</svg>
