<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="songBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="songAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c91919;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="80" height="80" fill="url(#songBg)" rx="8"/>
  
  <!-- Musical note -->
  <g transform="translate(40, 40)">
    <!-- Note stem -->
    <rect x="8" y="-20" width="3" height="25" fill="url(#songAccent)"/>
    
    <!-- Note head -->
    <ellipse cx="5" cy="8" rx="6" ry="4" fill="url(#songAccent)" transform="rotate(-20)"/>
    
    <!-- Musical staff lines -->
    <line x1="-25" y1="-8" x2="25" y2="-8" stroke="url(#songAccent)" stroke-width="1" opacity="0.4"/>
    <line x1="-25" y1="-4" x2="25" y2="-4" stroke="url(#songAccent)" stroke-width="1" opacity="0.4"/>
    <line x1="-25" y1="0" x2="25" y2="0" stroke="url(#songAccent)" stroke-width="1" opacity="0.4"/>
    <line x1="-25" y1="4" x2="25" y2="4" stroke="url(#songAccent)" stroke-width="1" opacity="0.4"/>
    <line x1="-25" y1="8" x2="25" y2="8" stroke="url(#songAccent)" stroke-width="1" opacity="0.4"/>
    
    <!-- Additional notes -->
    <text x="-15" y="-10" font-family="Arial" font-size="12" fill="url(#songAccent)" opacity="0.6">♪</text>
    <text x="15" y="5" font-family="Arial" font-size="10" fill="url(#songAccent)" opacity="0.6">♫</text>
  </g>
  
  <!-- Border -->
  <rect width="80" height="80" fill="none" stroke="#ff8c00" stroke-width="1" rx="8"/>
</svg>
