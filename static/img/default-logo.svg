<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c91919;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGradient)" stroke="#ff8c00" stroke-width="4"/>
  
  <!-- Music note -->
  <g transform="translate(60, 60)">
    <!-- Note stem -->
    <rect x="15" y="-25" width="3" height="35" fill="url(#logoGradient)"/>
    
    <!-- Note head -->
    <ellipse cx="12" cy="12" rx="8" ry="6" fill="url(#logoGradient)" transform="rotate(-20)"/>
    
    <!-- Musical staff lines -->
    <line x1="-25" y1="-10" x2="25" y2="-10" stroke="url(#logoGradient)" stroke-width="1" opacity="0.6"/>
    <line x1="-25" y1="-5" x2="25" y2="-5" stroke="url(#logoGradient)" stroke-width="1" opacity="0.6"/>
    <line x1="-25" y1="0" x2="25" y2="0" stroke="url(#logoGradient)" stroke-width="1" opacity="0.6"/>
    <line x1="-25" y1="5" x2="25" y2="5" stroke="url(#logoGradient)" stroke-width="1" opacity="0.6"/>
    <line x1="-25" y1="10" x2="25" y2="10" stroke="url(#logoGradient)" stroke-width="1" opacity="0.6"/>
    
    <!-- Treble clef -->
    <path d="M-20,-15 Q-15,-20 -10,-15 Q-5,-10 -10,-5 Q-15,0 -20,5 Q-25,10 -20,15 Q-15,20 -10,15" 
          stroke="url(#logoGradient)" stroke-width="2" fill="none" opacity="0.8"/>
  </g>
</svg>
